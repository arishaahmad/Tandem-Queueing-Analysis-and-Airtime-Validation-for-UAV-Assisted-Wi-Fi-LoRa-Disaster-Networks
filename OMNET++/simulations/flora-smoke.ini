[General]

network=uavwifilora.FloraSmokeNet
sim-time-limit=20s
simtime-resolution=ps

*.uav.numApps=1
*.uav.app[0].typename="SimpleLoRaApp"

*.uav.app[0].numberOfPacketsToSend=1
*.uav.app[0].timeToFirstPacket=6s
*.uav.app[0].dataSize=11B

*.uav.app[0].initialLoRaSF = 7
*.uav.app[0].initialLoRaBW = 125kHz
*.uav.app[0].initialLoRaCR = 1
*.uav.app[0].initialLoRaCF = 868MHz
*.uav.app[0].initialLoRaTP = 14dBm
*.uav.app[0].evaluateADRinNode = false

*.baseStation.numUdpApps = 1
*.baseStation.packetForwarder.localPort = 2000
*.baseStation.packetForwarder.destPort = 1000
*.baseStation.packetForwarder.destAddresses = "networkServer"
*.baseStation.packetForwarder.indexNumber = 0

**.LoRaGWNic.radio.iAmGateway = true

*.networkServer.numApps = 1
*.networkServer.app[0].typename = "NetworkServerApp"
*.networkServer.app[0].localPort = 1000
*.networkServer.app[0].destPort = 2000
*.networkServer.app[0].destAddresses = "baseStation"
*.networkServer.app[0].evaluateADRinServer = false

#  UAV POSITION
*.uav.mobility.initialX = 100m
*.uav.mobility.initialY = 100m
*.uav.mobility.initialZ = 50m

#BASE STATION POSITION
*.baseStation.mobility.initialX = 125m
*.baseStation.mobility.initialY = 100m
*.baseStation.mobility.initialZ = 0m

**.mobility.initFromDisplayString = false

# IMULATION AREA
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m

**.constraintAreaMaxX = 500m
**.constraintAreaMaxY = 500m
**.constraintAreaMaxZ = 100m


**.radio.radioMediumModule = "LoRaMedium"
**.maxTransmissionDuration = 4s
**.minInterferenceTime = 0s
**.alohaChannelModel = false

**.radio.separateTransmissionParts = false
**.radio.separateReceptionParts = false


**.vector-recording = true

