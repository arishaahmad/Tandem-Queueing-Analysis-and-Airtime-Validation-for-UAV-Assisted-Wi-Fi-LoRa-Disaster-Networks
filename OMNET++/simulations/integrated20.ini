# MULTI-DEVICE EXPERIMENT: event-driven Wi-Fi -> UAV -> LoRa -> gateway -> server
# Preserve the working single-device integrated.ini unchanged.
[General]
network = uavwifilora.UnifiedDisasterNet20
sim-time-limit = 100s
simtime-resolution = ps

# INET 4.4 Wi-Fi: 802.11n, 2.4 GHz, MCS0 nominal PHY rate
*.device[*].wlan[0].opMode = "n(mixed-2.4Ghz)"
*.uavWifi.wlan[0].opMode = "n(mixed-2.4Ghz)"
*.device[*].wlan[0].bitrate = 6.5Mbps
*.uavWifi.wlan[0].bitrate = 6.5Mbps
*.device[*].wlan[0].radio.radioMediumModule = "radioMedium"
*.uavWifi.wlan[0].radio.radioMediumModule = "radioMedium"

# Twenty disaster devices, each transmits one report within 6-8s
*.device[*].numApps = 1
*.device[*].app[0].typename = "UdpBasicApp"
*.device[*].app[0].destAddresses = "uavWifi"
*.device[*].app[0].destPort = 5000
*.device[*].app[0].messageLength = 11B
*.device[*].app[0].startTime = uniform(6s, 8s)
*.device[*].app[0].stopTime = 8.1s
*.device[*].app[0].sendInterval = 100s
*.uavWifi.numApps = 1
*.uavWifi.app[0].typename = "UdpSink"
*.uavWifi.app[0].localPort = 5000

# FLoRa UAV LoRa radio; relayMode suppresses periodic artificial transmission
*.uavLoRa.numApps = 1
*.uavLoRa.app[0].typename = "SimpleLoRaApp"
*.uavLoRa.app[0].relayMode = true
*.uavLoRa.app[0].numberOfPacketsToSend = 0
*.uavLoRa.app[0].timeToFirstPacket = 6s
*.uavLoRa.app[0].dataSize = 11B
*.uavLoRa.app[0].initialLoRaSF = 7
*.uavLoRa.app[0].initialLoRaBW = 125kHz
*.uavLoRa.app[0].initialLoRaCR = 1
*.uavLoRa.app[0].initialLoRaCF = 868MHz
*.uavLoRa.app[0].initialLoRaTP = 14dBm
*.uavLoRa.app[0].evaluateADRinNode = false
*.uavLoRa.LoRaNic.radio.radioMediumModule = "LoRaMedium"
*.baseStation.LoRaGWNic.radio.radioMediumModule = "LoRaMedium"

# Gateway and network server: copied from successful LoRa test
*.baseStation.numUdpApps = 1
*.baseStation.packetForwarder.localPort = 2000
*.baseStation.packetForwarder.destPort = 1000
*.baseStation.packetForwarder.destAddresses = "networkServer"
*.baseStation.packetForwarder.indexNumber = 0
**.LoRaGWNic.radio.iAmGateway = true
*.networkServer.numApps = 1
*.networkServer.app[0].typename = "NetworkServerApp"
*.networkServer.app[0].localPort = 1000
*.networkServer.app[0].destPort = 2000
*.networkServer.app[0].destAddresses = "baseStation"
*.networkServer.app[0].evaluateADRinServer = false

# Device and collocated UAV Wi-Fi/LoRa modules
**.mobility.initFromDisplayString = false
*.device[*].mobility.initialX = uniform(70m, 130m)
*.device[*].mobility.initialY = uniform(70m, 130m)
*.device[*].mobility.initialZ = 0m
*.uavWifi.mobility.initialX = 150m
*.uavWifi.mobility.initialY = 100m
*.uavWifi.mobility.initialZ = 50m
*.uavLoRa.mobility.initialX = 150m
*.uavLoRa.mobility.initialY = 100m
*.uavLoRa.mobility.initialZ = 50m
*.baseStation.mobility.initialX = 175m
*.baseStation.mobility.initialY = 100m
*.baseStation.mobility.initialZ = 0m
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 500m
**.constraintAreaMaxY = 500m
**.constraintAreaMaxZ = 100m

**.maxTransmissionDuration = 4s
**.minInterferenceTime = 0s
**.alohaChannelModel = false
**.radio.separateTransmissionParts = false
**.radio.separateReceptionParts = false
**.scalar-recording = true
**.vector-recording = true
